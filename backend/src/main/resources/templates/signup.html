<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up · WebSprint</title>
    <meta name="description" content="Create your WebSprint account and start learning to code." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;800&family=Press+Start+2P&display=swap"
        rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/base.css}" />
</head>
<body>

    <header class="site-header">
        <div class="brand">
            <span class="brand__logo">&lt;#&gt;</span>
            <span class="brand__name">WEB<span class="sprint">SPRINT</span></span>
        </div>
    </header>

    <main class="auth">
        <div class="auth__card">
            <h1 class="auth__title">Create Account</h1>
            <p class="auth__subtitle">Join WebSprint and start your coding journey</p>

            <p th:if="${emailError}" th:text="${emailError}" class="auth__error"></p>
            <p th:if="${passwordError}" th:text="${passwordError}" class="auth__error"></p>

            <!-- Native form POST — field names (fullName, email, password, confirmPassword)
                 map directly onto SignupRequest in RegistrationController -->
            <form th:action="@{/req/signup}" method="post" novalidate>
                <div class="field" id="f-name">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Code Master" required />
                </div>

                <div class="field" id="f-email">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required />
                </div>

                <div class="field" id="f-password">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" required />
                </div>

                <div class="field" id="f-confirm">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required />
                </div>

                <button type="submit" class="btn btn--primary btn--block">Create Account →</button>
            </form>

            <div class="divider">OR</div>

            <!-- Static placeholder until Google auth is implemented -->
            <button class="btn btn--ghost btn--block" type="button" disabled>Sign up with Google</button>

            <p class="auth__foot">
                Already have an account? <a th:href="@{/login}">Log in</a>
            </p>
        </div>
    </main>

    <script th:src="@{/js/script.js}" defer></script>
</body>
</html>
