<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up · WebSprint</title>
    <meta name="description" content="Create your WebSprint account and start learning to code." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;800&family=Press+Start+2P&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
</head>
<body>

    <header class="site-header">
        <div class="brand">
            <span class="brand__logo">&lt;#&gt;</span>
            <span class="brand__name">WEB<span class="sprint">SPRINT</span></span>
        </div>
    </header>

    <main class="auth">
        <div class="auth__card">
            <h1 class="auth__title">Create Account</h1>
            <p class="auth__subtitle">Join WebSprint and start your coding journey</p>

            <!-- Native form POST — field names (name, email, password, confirm)
                 map onto SignupRequest in RegistrationController -->
            <form id="signupForm" novalidate>
                <div class="field" id="f-name">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Code Master" required />
                    <span class="field__error"></span>
                </div>

                <div class="field" id="f-email">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required />
                    <span class="field__error"></span>
                </div>

                <div class="field" id="f-password">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" required />
                    <span class="field__error"></span>
                </div>

                <div class="field" id="f-confirm">
                    <label for="confirm">Confirm Password</label>
                    <input type="password" id="confirm" name="confirm" placeholder="Re-enter password" required />
                    <span class="field__error"></span>
                </div>

                <button type="submit" class="btn btn--primary btn--block">Create Account →</button>
            </form>

            <div class="divider">OR</div>

            <a class="btn btn--ghost btn--block" href="/oauth2/authorization/google">Sign up with Google</a>

            <p class="auth__foot">
                Already have an account? <a href="login">Log in</a>
            </p>
        </div>
    </main>

    <script src="js/script.js" defer></script>
</body>
</html>
