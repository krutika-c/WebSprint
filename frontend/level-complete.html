            <p class="course-hero__desc">
                Amazing work! You have completed HTML Level 1.
            </p>
        </div>

    <main id="shell" data-active="courses">

            <div class="reward-row">

                    <span class="reward__icon">⭐</span>
                    <span class="reward__text">+100 XP</span>
