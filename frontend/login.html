<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · WebSprint</title>
    <meta name="description" content="Log in to WebSprint and continue your coding journey." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;800&family=Press+Start+2P&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
</head>
<body>

   
    <header class="site-header">
        <div class="brand">
            <span class="brand__logo">&lt;#&gt;</span>
                <span class="brand__name">WEB<span class="sprint">SPRINT</span></span>
        </div>
    </header>

    
    <main class="auth">
        <div class="auth__card">
            <h1 class="auth__title">Welcome Back</h1>
            <p class="auth__subtitle">Log in to keep leveling up your skills</p>

            <form id="loginForm" novalidate>
                
                <div class="field" id="f-email">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" />
                    <p class="field__error">Enter a valid email address.</p>
                </div>

                
                <div class="field" id="f-password">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" />
                    <p class="field__error">Password must be at least 6 characters.</p>
                </div>

               
                <div class="auth__row">
                    <label class="muted">
                        <input type="checkbox" /> Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

               
                <a href="h1.html" class="btn btn--primary btn--block">Log In →</a>


            </form>

         
            <div class="divider">OR</div>

            
            <button class="btn btn--ghost btn--block">Continue with Google</button>

           
            <p class="auth__foot">
                Don't have an account? <a href="signup.html">Sign up</a>
            </p>
        </div>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
