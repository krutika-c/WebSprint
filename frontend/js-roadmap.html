    <!-- ═══ COURSE HERO ═══ -->
    <section class="course-hero" data-bg="js">

        <div class="course-hero__bg"></div>

        <div class="course-hero__content">

            <div class="course-hero__badge">
                <span class="badge badge--beginner">⚡ BEGINNER</span>
                <span class="badge badge--course">COURSE</span>
            </div>

            <h1 class="course-hero__title">JavaScript</h1>

            <p class="course-hero__desc">
                Add interactivity and bring your websites to life with JavaScript.
            </p>

        </div>
    </section>


    <!-- ═══ MAIN CONTENT ═══ -->
    <main id="shell" data-active="courses">

        <!-- Page heading -->
        <div class="page-head">
            <h2 class="page-title">JavaScript Roadmap</h2>
            <p class="page-subtitle">Learn JavaScript step by step</p>
        </div>


        <!-- ─── Roadmap Layout ─── -->
        <div class="roadmap">

            <!-- Steps list -->
            <!-- Levels will be loaded from the backend -->
            <div class="roadmap__list" id="levels-container">
            </div>


            <!-- ─── Progress Sidebar ─── -->
            <aside class="roadmap__sidebar card">

                <p class="section-label">Your Progress</p>

                <div class="ring-wrap">
                    <div class="ring" id="progress-ring" style="--val: 0">
                        <div class="ring__label">
                            <b id="progress-ring-pct">0%</b>
                            <span id="progress-ring-label">0 of 0 completed</span>
                        </div>
                    </div>
                </div>

                <div class="kv">
                    <span>XP Earned</span>
                    <b id="xp-earned">0 XP</b>
                </div>

                <div class="kv">
                    <span>Next Reward</span>
                    <b id="next-reward">🏆 —</b>
                </div>

            </aside>

        </div>


        <!-- Page indicator -->
        <div class="page-indicator">2. JAVASCRIPT ROADMAP</div>

    </main>


    <!-- ═══ JAVASCRIPT ═══ -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/progress.js"></script>
