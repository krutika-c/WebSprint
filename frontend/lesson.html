<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Learn HTML step by step with WebSprint."
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&family=Press+Start+2P&display=swap"

    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/learn.css">

</head>


<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header">

    <div class="header-inner">

        <a href="h1.html" class="brand">

            <span class="brand__logo">
                &lt;#&gt;
            </span>

            <span class="brand__name">
                WEB<span class="sprint">SPRINT</span>
            </span>

        </a>


        <nav class="main-nav">

            <a
                href="dashboard.html"
                class="nav-link"
            >
                Dashboard
            </a>

            <a
                href="choose-topic.html"
                class="nav-link"
            >
                Topics
            </a>

            <a
                href="achivements.html"
                class="nav-link"
            >
                Achievements
            </a>


            <a
                href="settings.html"
                class="nav-link nav-link--icon"
                aria-label="Settings"
            >

                <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>

                    <circle
                        cx="12"

                    />

                </svg>

            </a>


            <a
                href="profile.html"
                class="nav-link nav-link--profile"
                aria-label="Profile"
            >

                <span class="profile-avatar--nav">
                    CM
                </span>

                <span class="profile-caret">
                    ▾
                </span>

            </a>

        </nav>

    </div>

</header>



<!-- =====================================================
     PIXEL LESSON HEADER
===================================================== -->

<section class="pixel-lesson-hero">

    <div class="pixel-grid"></div>

    <div class="pixel-hero-content">

        <div class="lesson-code-label">

            <span class="pixel-cursor"></span>

            HTML / COURSE

            <span class="slash">
                //
            </span>

            <span id="lesson-number">
                LESSON 01
            </span>

        </div>


        <h1
            id="lesson-title"
            class="pixel-lesson-title"
        >
            HTML BASICS
        </h1>


        <p
            id="lesson-description"
            class="pixel-lesson-description"
        >
            Learn the fundamentals of HTML.
        </p>

    </div>

</section>



<!-- =====================================================
     MAIN
===================================================== -->

<main
    id="shell"
    class="lesson-page"
>


    <!-- TOP NAV -->

    <div class="lesson-top-navigation">

        <a
            href="html-roadmap.html"
            class="pixel-back"
        >
            ← ROADMAP
        </a>


        <div
            id="lesson-pager"
            class="pixel-pager"
        >
            01 / 20
        </div>

    </div>



    <!-- =================================================
         LESSON AREA
    ================================================= -->

    <section class="pixel-lesson-layout">


        <!-- =================================================
             LESSON
        ================================================= -->

        <article class="pixel-lesson-window">


            <!-- WINDOW BAR -->

            <div class="pixel-window-bar">

                <div class="pixel-window-title">

                    <span class="window-icon">
                        &gt;_
                    </span>

                    LESSON.TXT

                </div>


                <div class="pixel-window-buttons">

                    <span>_</span>
                    <span>□</span>
                    <span>×</span>

                </div>

            </div>



            <!-- API CONTENT -->

            <div
                id="lesson-content"
                class="pixel-lesson-content"
            >

                <p class="pixel-loading">
                    Loading...
                </p>

            </div>

        </article>



        <!-- =================================================
             LIVE PREVIEW
        ================================================= -->

        <aside class="pixel-preview-window">


            <div class="pixel-window-bar">

                <div class="pixel-window-title">

                    <span class="window-icon">
                        ◉
                    </span>

                    LIVE PREVIEW

                </div>


                <span class="live-indicator">
                    ● LIVE
                </span>

            </div>



            <!-- BROWSER -->

            <div class="pixel-browser">


                <div class="browser-bar">

                    <div class="browser-dots">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <div class="browser-url">
                        localhost / preview
                    </div>

                </div>


                <div
                    id="lesson-preview"
                    class="preview-content"
                >

                    <h1>
                        Hello, WebSprint!
                    </h1>

                    <p>
                        Welcome to your coding journey.
                    </p>

                </div>

            </div>

        </aside>

    </section>



    <!-- =================================================
         LESSON NAVIGATION
    ================================================= -->

    <div class="pixel-lesson-navigation">


        <button
            type="button"
            id="prev-lesson"
            class="pixel-navigation-button"
        >
            ← PREVIOUS
        </button>


        <div class="pixel-level-display">

            <span class="pixel-block"></span>

            LESSON

            <span class="pixel-block"></span>

        </div>


        <a
            href="#"
            id="next-lesson"
            class="pixel-navigation-button pixel-next"
        >
            NEXT LESSON →
        </a>

    </div>

</main>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="js/config.js"></script>
<script src="js/api.js"></script>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="js/lesson.js"></script>
<script src="js/script.js" defer></script>

</body>

</html>
