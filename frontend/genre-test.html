<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genre Test · WebSprint</title>
  <meta name="description" content="Test your knowledge and find your starting point on WebSprint." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;800&family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="shell" data-active="tests">
    <a href="dashboard.html" class="back-btn">← Back</a>
    <div class="page-head">
      <h1 class="page-title">Genre Test</h1>
      <p class="page-subtitle">Test your knowledge and find your starting point</p>
    </div>
    <div class="card quiz">
      <p class="question-num">Question 1 of 10</p>
      <h2 class="question">What does HTML stand for?</h2>
      <div class="options">
        <button class="option is-selected">
          <span class="option__key">A</span> Hyper Text Markup Language
        </button>
        <button class="option">
          <span class="option__key">B</span> High Tech Modern Language
        </button>
        <button class="option">
          <span class="option__key">C</span> Hyperlinks and Text Markup Language
        </button>
        <button class="option">
          <span class="option__key">D</span> Home Tool Markup Language
        </button>
      </div>
      <div class="editor-actions mt-24">
        <a href="test-result.html" class="btn btn--primary">Next →</a>
      </div>
    </div>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
