<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up · WebSprint</title>
    <meta name="description" content="Create your WebSprint account and start learning to code." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;800&family=Press+Start+2P&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />

    <link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js" defer></script>
<script src="js/avatar-sync.js" defer></script>

<style>
    /* Live username availability hint — same colors used on the
       Settings/profile page (css/settings.css .field-hint), kept local
       here so this page doesn't need to pull in that whole stylesheet. */
    .field-hint {
        display: block;
        margin-top: 0.35rem;
        font-size: 0.8rem;
        min-height: 1.1em;
    }
    .field-hint.is-checking { color: #9aa4af; }
    .field-hint.is-available { color: #8bffb0; }
    .field-hint.is-taken { color: #ff8b8b; }
</style>
</head>
<body>

    <header class="site-header">
        <div class="brand">
            <span class="brand__logo">&lt;#&gt;</span>
            <span class="brand__name">WEB<span class="sprint">SPRINT</span></span>
        </div>
    </header>

    <main class="auth">
        <div class="auth__card">
            <h1 class="auth__title">Create Account</h1>
            <p class="auth__subtitle">Join WebSprint and start your coding journey</p>

            <!-- Native form POST — field names (name, email, username, password,
                 confirm) map onto SignupRequest in RegistrationController -->
            <form id="signupForm" novalidate>
                <div class="field" id="f-name">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Code Master" required />
                    <span class="field__error"></span>
                </div>

                <div class="field" id="f-email">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required />
                    <span class="field__error"></span>
                </div>

                <div class="field" id="f-username">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="e.g. code_master99" autocomplete="off" required />
                    <small id="username-status" class="field-hint"></small>
                    <span class="field__error"></span>
                </div>

                <div class="field" id="f-password">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="At least 6 characters"
                        />

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="Show password"
                        >
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                    <span class="field__error"></span>
                </div>

                <div class="field" id="f-confirm">
                    <label for="confirm">Confirm Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirm"
                            name="confirm"
                            placeholder="Re-enter password"
                        />

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirm"
                            aria-label="Show password"
                        >
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                    <span class="field__error"></span>
                </div>

                <button type="submit" class="btn btn--primary btn--block">Create Account →</button>
            </form>

            <div class="divider">OR</div>

            <a class="btn btn--ghost btn--block" href="http://localhost:8080/oauth2/authorization/google">Sign up with Google</a>

            <p class="auth__foot">
                Already have an account? <a href="login.html">Log in</a>
            </p>
        </div>
    </main>

     <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/script.js" defer></script>
    <script src="js/password.js" defer></script>
</body>
</html>
