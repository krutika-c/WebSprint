<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Achievements · WebSprint</title>
    <meta name="description" content="Collect badges and show your progress on WebSprint." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;800&family=Press+Start+2P&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/achivements.css" />

    <link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js" defer></script>
<script src="js/avatar-sync.js" defer></script>
</head>
<body>

  
    <header class="site-header">
        <div class="header-inner">
            <div class="brand">
                <a href="h1.html" class="brand" style="text-decoration: none;">
                <span class="brand__logo">&lt;#&gt;</span>
                <span class="brand__name">WEB<span class="sprint">SPRINT</span></span>
            </a>
            </div>
            <nav class="main-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="choose-topic.html" class="nav-link">Topics</a>
                <a href="achivements.html" class="nav-link">Achievements</a>
               
                <a href="settings.html" class="nav-link nav-link--icon" aria-label="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </a>

               
                <a href="profile.html" class="nav-link nav-link--profile" aria-label="Profile">
                    <span class="profile-avatar--nav">CM</span>
                    <span class="profile-caret">▾</span>
                </a>
            </nav>
        </div>
    </header>

    
    <section class="course-hero course-hero--compact">
        <div class="course-hero__bg"></div>
        <div class="course-hero__content">
            <div class="course-hero__badge">
                <span class="badge badge--beginner">🏆 COLLECTION</span>
                <span class="badge badge--course">ACHIEVEMENTS</span>
            </div>
            <h1 class="course-hero__title">Achievements</h1>
            <p class="course-hero__desc">
                Collect badges and show your progress
            </p>
        </div>
    </section>

    
    <main id="shell" data-active="achievements">

       
        <div class="filter-tabs">
            <button class="filter-tab is-active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="unlocked">Unlocked</button>
            <button class="filter-tab" data-filter="locked">Locked</button>
        </div>

       
        <div class="ach-grid">
            <!-- Cards are rendered by js/achievements.js from the user's
                 real progress/XP/streak data (see GET /api/progress and
                 GET /api/me/stats) — nothing here is hardcoded anymore. -->
        </div>

        
        <div class="page-indicator"></div>

    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/script.js" defer></script>
</body>
</html>
