<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Signing you in… · WebSprint</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js" defer></script>
<script src="js/avatar-sync.js" defer></script>

</head>
<body>
    <p>Signing you in…</p>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const needsUsername = params.get('needsUsername') === 'true';

        if (token) {
            localStorage.setItem('token', token);
            // Brand-new Google sign-ups haven't picked a username yet
            // (see OAuth2LoginSuccessHandler) — send them to that
            // onboarding step first, same as the signup form does for
            // email/password accounts. Everyone else goes straight on.
            if (needsUsername) {
                // set-username.js reads this flag instead of asking the
                // server (GET /api/users/me auto-generates a username when
                // none exists, which made the page think onboarding was
                // already done and skip straight to h1.html).
                try { sessionStorage.setItem('websprint.needsUsername', '1'); } catch (e) {}
            }
            window.location.href = needsUsername ? 'set-username.html' : 'h1.html';
            // h1.html sends anyone who's already taken the placement test
            // on to choose-topic.html, so returning Google users skip it.
        } else {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
