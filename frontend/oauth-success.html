<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Signing you in… · WebSprint</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js" defer></script>
<script src="js/avatar-sync.js" defer></script>

</head>
<body>
    <p>Signing you in…</p>

    <!-- No "defer" here on purpose: the inline script below runs immediately
         and needs setToken() to already exist. -->
    <script src="js/auth.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const needsUsername = params.get('needsUsername') === 'true';

        if (token) {
            // Google sign-ins are ALWAYS remembered: the token goes in localStorage,
            // so it survives closing the browser. (The backend gives Google tokens
            // a 30-day lifetime; see OAuth2LoginSuccessHandler.)
            setToken(token, true);

            // Remove the token from the address bar so it doesn't stay in browser history.
            history.replaceState(null, '', window.location.pathname);

            // Brand-new Google sign-ups haven't picked a username yet
            // (see OAuth2LoginSuccessHandler) — send them to that
            // onboarding step first, same as the signup form does for
            // email/password accounts. Everyone else goes straight on.
            if (needsUsername) {
                // set-username.js reads this flag instead of asking the
                // server (GET /api/users/me auto-generates a username when
                // none exists, which made the page think onboarding was
                // already done and skip straight to h1.html).
                try { sessionStorage.setItem('websprint.needsUsername', '1'); } catch (e) {}
            }
            window.location.href = needsUsername ? 'set-username.html' : 'h1.html';
            // h1.html sends anyone who's already taken the placement test
            // on to choose-topic.html, so returning Google users skip it.
        } else {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
