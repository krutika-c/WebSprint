<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings · WebSprint</title>
    <meta name="description" content="Manage your WebSprint profile, preferences and account." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;800&family=Press+Start+2P&display=swap"
        rel="stylesheet"
    />
     <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/settings.css" />

    <link rel="stylesheet" href="css/theme.css">
<script src="js/theme.js" defer></script>
<script src="js/avatar-sync.js" defer></script>
</head>
<body>

    
    <header class="site-header">
        <div class="header-inner">
            <a href="h1.html" class="brand" style="text-decoration: none;">
                <span class="brand__logo">&lt;#&gt;</span>
                <span class="brand__name">WEB<span class="sprint">SPRINT</span></span>
            </a>
            <nav class="main-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="choose-topic.html" class="nav-link">Topics</a>
                <a href="achivements.html" class="nav-link">Achievements</a>

               
                <a href="settings.html" class="nav-link nav-link--icon" aria-label="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </a>

               
                <a href="profile.html" class="nav-link nav-link--profile" aria-label="Profile">
                    <span class="profile-avatar--nav" id="nav-avatar">CM</span>
                    <span class="profile-caret">▾</span>
                </a>
            </nav>
        </div>
    </header>

    
    <section class="course-hero course-hero--compact">
        <div class="course-hero__bg"></div>
        <div class="course-hero__content">
            <div class="course-hero__badge">
                <span class="badge badge--beginner">⚙️ PREFERENCES</span>
                <span class="badge badge--course">SETTINGS</span>
            </div>
            <h1 class="course-hero__title">Settings</h1>
            <p class="course-hero__desc">
                Manage your profile and account
            </p>
        </div>
    </section>

    
    <main id="shell" data-active="settings">

        
        <div class="tabs" data-tabs>
            <button class="tab is-active">Profile</button>
            <button class="tab">Preferences</button>
            <button class="tab">Account</button>
        </div>

       
        <div class="settings-grid">

            
            <div class="settings-left">
                <div class="card">
                    <div class="profile-head">
                        <div class="avatar-picker-wrap">
                            <div class="profile-avatar" id="profile-avatar-big">CM</div>
                            <button class="btn btn--ghost" style="padding: 4px 12px; font-size: 0.75rem; margin-top: 4px;" id="change-avatar-btn" type="button" title="Choose a preset avatar" aria-haspopup="true" aria-expanded="false">Change Avatar</button>

                            <div class="avatar-picker" id="avatar-picker" hidden>
                                <p class="avatar-picker__label">Pick an avatar</p>
                                <div class="avatar-picker__grid" id="avatar-picker-grid"></div>
                            </div>
                        </div>
                        <div>
                            <strong style="font-size: 1.1rem; color: #f0f6fc;" id="profile-display-name">CodeMaster</strong>
                            <div class="stat__lbl">Level 12</div>
                        </div>
                    </div>

                    <div class="field" id="f-name">
                        <label for="name">Display Name</label>
                        <div class="field-with-action">
                            <input type="text" id="name" name="name" value="CodeMaster" disabled />
                            <button type="button" class="field-edit-btn" id="edit-name" aria-label="Edit display name" title="Edit display name">✎</button>
                        </div>
                        <small id="name-status" class="field-hint"></small>
                    </div>

                    <div class="field" id="f-username">
                        <label for="username">Username</label>
                        <div class="field-with-action">
                            <input type="text" id="username" name="username" value="" placeholder="Choose a username" autocomplete="off" disabled />
                            <button type="button" class="field-edit-btn" id="edit-username" aria-label="Edit username" title="Edit username">✎</button>
                        </div>
                        <small id="username-status" class="field-hint"></small>
                    </div>

                    <div class="field" id="f-email">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="codemaster@email.com" disabled />
                    </div>

                    <div class="field">
                        <label for="joined">Joined</label>
                        <input type="text" id="joined" value="May 12, 2024" disabled />
                    </div>

                    <button class="btn btn--primary" id="save-username">Save Changes</button>
                    <small id="save-status" class="field-hint"></small>
                </div>
            </div>

            
            <aside class="settings-right">
                <div class="card">
                    <p class="section-label">Your Stats</p>
                    <div class="kv"><span>Total XP</span><b id="profile-stat-xp">0 XP</b></div>
                    <div class="kv"><span>Lessons Completed</span><b id="profile-stat-lessons">0</b></div>
                    <div class="kv"><span>Badges Earned</span><b>8</b></div>
                    <div class="kv"><span>Current Streak</span><b id="profile-stat-streak">0 Days</b></div>
                    <div class="kv"><span>Longest Streak</span><b id="profile-stat-longest-streak">0 Days</b></div>
                    <a href="login.html" class="btn btn--ghost btn--block" style="margin-top: 1.5rem;">Log Out</a>
                </div>
            </aside>

        </div>
-
        <div class="page-indicator">6. SETTINGS</div>

    </main>

    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/progress.js" defer></script>
    <script src="js/profile.js" defer></script>
    <script src="js/script.js" defer></script>
</body>
</html>
