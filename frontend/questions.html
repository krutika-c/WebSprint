<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quiz · WebSprint</title>
    <meta
        name="description"
        content="Test your knowledge with WebSprint quizzes."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;800&family=Press+Start+2P&display=swap"
        rel="stylesheet"
    />

    <!-- Common Website CSS -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/question.css">

    <!-- Quiz-specific CSS -->
    <link rel="stylesheet" href="css/question.css" />
</head>

<body>

    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="site-header">

        <div class="header-inner">

            <div class="brand">

                <a
                    href="h1.html"
                    class="brand"
                    style="text-decoration: none;"
                >

                    <span class="brand__logo">
                        &lt;#&gt;
                    </span>

                    <span class="brand__name">
                        WEB<span class="sprint">SPRINT</span>
                    </span>

                </a>

            </div>


            <nav class="main-nav">

                <a
                    href="dashboard.html"
                    class="nav-link"
                >
                    Dashboard
                </a>

                <a
                    href="choose-topic.html"
                    class="nav-link"
                >
                    Topics
                </a>

                <a
                    href="achivements.html"
                    class="nav-link"
                >
                    Achievements
                </a>


                <!-- Settings -->

                <a
                    href="settings.html"
                    class="nav-link nav-link--icon"
                    aria-label="Settings"
                >

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        />

                    </svg>

                </a>


                <!-- Profile -->

                <a
                    href="profile.html"
                    class="nav-link nav-link--profile"
                    aria-label="Profile"
                >

                    <span class="profile-avatar--nav">
                        CM
                    </span>

                    <span class="profile-caret">
                        ▾
                    </span>

                </a>

            </nav>

        </div>

    </header>


    <!-- ==================================================
         QUIZ PAGE
    ================================================== -->

    <main id="shell" class="quiz-page">

        <div class="quiz-container">


            <!-- ==========================================
                 PAGE HEADER
            =========================================== -->

            <div class="quiz-page-head">

                <p class="quiz-eyebrow">
                    WEBSPRINT • PRACTICE
                </p>

                <h1 class="quiz-title">
                    TEST YOUR KNOWLEDGE
                </h1>

                <p class="quiz-subtitle">
                    Answer the questions and level up your skills.
                </p>

            </div>


            <!-- ==========================================
                 QUIZ HEADER
            =========================================== -->

            <div class="quiz-topbar">

                <div class="quiz-level-info">

                    <span class="quiz-label">
                        LEVEL
                    </span>

                    <span
                        id="quiz-level"
                        class="quiz-value"
                    >
                        1
                    </span>

                </div>


                <div class="quiz-progress-info">

                    <span
                        id="question-progress"
                        class="quiz-progress-text"
                    >
                        QUESTION 1 / 1
                    </span>

                </div>

            </div>


            <!-- ==========================================
                 PROGRESS BAR
            =========================================== -->

            <div class="quiz-progress">

                <div
                    id="quiz-progress-fill"
                    class="quiz-progress__fill"
                    style="width: 0%;"
                ></div>

            </div>


            <!-- ==========================================
                 QUESTION CARD
            =========================================== -->

            <section class="question-card">

                <div class="question-card__number">

                    <span>
                        QUESTION
                    </span>

                </div>


                <h2
                    id="question-text"
                    class="question-text"
                >
                    Loading question...
                </h2>


                <!-- ======================================
                     OPTIONS
                ======================================= -->

                <div
                    id="options-container"
                    class="options-container"
                >
                    <!-- Options generated by question.js -->
                </div>


                <!-- ======================================
                     ANSWER FEEDBACK
                ======================================= -->

                <div
                    id="answer-feedback"
                    class="answer-feedback"
                    aria-live="polite"
                >
                </div>


                <!-- ======================================
                     NEXT BUTTON
                ======================================= -->

                <div class="question-actions">

                    <button
                        id="next-question"
                        class="btn btn--primary"
                        type="button"
                        style="display: none;"
                    >
                        Next Question →
                    </button>

                </div>

            </section>


            <!-- ==========================================
                 QUIZ FOOTER
            =========================================== -->

            <div class="quiz-footer">

                <a
                    href="html-roadmap.html"
                    class="quiz-back"
                >
                    ← Back to Roadmap
                </a>

                <span class="quiz-footer__text">
                    Learn • Practice • Level Up
                </span>

            </div>


        </div>

    </main>


    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/question.js"></script>

</body>

</html>
